name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check app/ tests/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticket_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Full test environment
      API_KEY: test-api-key
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/ticket_triage_test
      SYNC_DATABASE_URL: postgresql://postgres:password@localhost:5432/ticket_triage_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.0-flash
      GEMINI_EMBEDDING_MODEL: text-embedding-004
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "1024"
      LLM_RETRY_ATTEMPTS: "2"
      RAG_TOP_K: "5"
      DEFAULT_PAGE_SIZE: "20"
      MAX_PAGE_SIZE: "100"
      TICKET_SUBJECT_MAX_LEN: "200"
      TICKET_DESCRIPTION_MAX_LEN: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  postman:
    name: Postman (Newman)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ticket_triage_postman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          SYNC_DATABASE_URL: postgresql://postgres:password@localhost:5432/ticket_triage_postman
        run: alembic upgrade head

      - name: Start API server
        env:
          API_KEY: postman-test-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/ticket_triage_postman
          SYNC_DATABASE_URL: postgresql://postgres:password@localhost:5432/ticket_triage_postman
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
          GEMINI_EMBEDDING_MODEL: text-embedding-004
          LLM_TEMPERATURE: "0.1"
          LLM_MAX_TOKENS: "1024"
          LLM_RETRY_ATTEMPTS: "1"
          RAG_TOP_K: "5"
          DEFAULT_PAGE_SIZE: "20"
          MAX_PAGE_SIZE: "100"
          TICKET_SUBJECT_MAX_LEN: "200"
          TICKET_DESCRIPTION_MAX_LEN: "5000"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman collection
        run: |
          newman run postman/ticket_triage.postman_collection.json \
            -e postman/ticket_triage.postman_environment.json \
            --env-var "base_url=http://localhost:8000" \
            --env-var "api_key=postman-test-key" \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json

